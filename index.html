<!DOCTYPE html>
<html lang="om">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<!-- Font Awesome Icons CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background-image:
    linear-gradient(
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.55)
    ),
    url("1.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    padding-bottom: 70px; /* Space for fixed bottom menu */
}

/* Top Header / Logo */
.header{
    width:100%;
    padding:20px;
    text-align:center;
    background:rgba(0,0,0,0.5);
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#00ffcc;
}

/* Home Section */
.home{
    min-height:calc(100vh - 150px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.content{
    transform:translateY(0);
}

/* Buttons */
.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
}

.signup,
.signin{
    padding:15px 40px;
    border-radius:30px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.signup{
    background:#00ffcc;
    color:black;
}

.signup:hover{
    background:white;
}

.signin{
    border:2px solid #00ffcc;
    color:white;
}

.signin:hover{
    background:#00ffcc;
    color:black;
}

/* Bottom Navigation Bar */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid rgba(0, 255, 204, 0.3);
    z-index: 1000;
}

.bottom-nav a {
    color: white;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    gap: 4px;
    transition: 0.3s;
}

.bottom-nav a i {
    font-size: 20px;
}

.bottom-nav a:hover,
.bottom-nav a.active {
    color: #00ffcc;
}

/* Mobile responsive adjustments */
@media(max-width:600px){
    .logo{
        font-size:22px;
    }

    .buttons{
        flex-direction:column;
        gap:15px;
    }

    .signup,
    .signin{
        width:220px;
        text-align:center;
    }

    footer{
        font-size:12px;
    }
}

</style>

</head>

<body>

<!-- HEADER LOGO -->
<div class="header">
    <div class="logo">
        <h3>Dani Abbaa Carraa Online 🎁</h3>
    </div>
</div>

<!-- HOME SECTION -->
<section class="home">
    <div class="content">
        <div class="buttons">
            <a href="signup.html" class="signup">
                Sign Up
            </a>

            <a href="signin.html" class="signin">
                Sign In
            </a>
        </div>
    </div>
</section>

<!-- BOTTOM NAVIGATION MENU WITH ICONS -->
<nav class="bottom-nav">
    <a href="index.html" class="active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>
    <a href="about.html">
        <i class="fa-solid fa-circle-info"></i>
        <span>About</span>
    </a>
    <a href="blog.html">
        <i class="fa-solid fa-newspaper"></i>
        <span>Blog</span>
    </a>
    <a href="service.html">
        <i class="fa-solid fa-concierge-bell"></i>
        <span>Service</span>
    </a>
    <a href="dashboard.html">
          <i class="fa-solid fa-user"></i>
        <span>me</span>
    </a>
</nav>

<script>
console.log("Website Loaded");
</script>

</body>

</html>
